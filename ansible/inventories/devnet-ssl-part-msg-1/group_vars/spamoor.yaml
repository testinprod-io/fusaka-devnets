spamoor_container_image: "docker.ethquokkaops.io/dh/ethpandaops/spamoor:master"

spamoor_container_command: |
  blobs
  --refill-amount=1000
  --refill-balance=10000
  --refill-interval=60
  -h="https://{{ secret_nginx_shared_basic_auth.name }}:{{ secret_nginx_shared_basic_auth.password }}@rpc.mev-relay-1.{{ network_subdomain }}"
  -p={{ tx_fuzz_txs_privkey }}
  -t=1
  --max-wallets=4
  --blob-v1-percent=100
  --fulu-activation=1
  --max-pending=1000
  #--throughput-increment-interval=600
  #-h="type(builder)http://{{ secret_nginx_shared_basic_auth.name }}:{{ secret_nginx_shared_basic_auth.password }}@rpc.mev-relay-1.{{ network_subdomain }}:8645"