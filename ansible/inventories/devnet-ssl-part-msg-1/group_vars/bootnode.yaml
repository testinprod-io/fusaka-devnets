ethereum_cl_bootnodes: []

ethereum_el_bootnodes:
  - "{{ hostvars['bootnode-1']['ethereum_node_fact_el_enode'] }}"
  #- "{{ hostvars['teku-geth-1']['ethereum_node_fact_el_enode'] }}"

# role: eth_inventory_web
cl_bootnode_privkey: "5beb5bcd4d7fe23f1a365722a0eec9f45583ea1a4e1c3a0e7f72482c241b682e"
eth_inventory_web_container_networks: "{{ docker_networks_shared }}"
eth_inventory_web_container_env:
  VIRTUAL_HOST: "{{ server_fqdn }}"
  VIRTUAL_PORT: "80"
  VIRTUAL_PATH: "/meta/api"
  VIRTUAL_DEST: "/"
  LETSENCRYPT_HOST: "{{ server_fqdn }}"
ethereum_node_xatu_sentry_enabled: true

# role: ethpandaops.general.ethereum_node
ethereum_node_el: geth
ethereum_node_cl: lighthouse
ethereum_node_cl_validator_enabled: false

# Disable checkpoint sync for bootnode (it's the source, not the consumer)
ethereum_node_cl_checkpoint_sync_enabled: false


