spamoor_container_image: "docker.ethquokkaops.io/dh/ethpandaops/spamoor:master-latest"

spamoor_container_command: |
  dblobs
  -p={{ tx_fuzz_txs_privkey }}
  --max-wallets=200
  -h="https://{{ secret_nginx_shared_basic_auth.name }}:{{ secret_nginx_shared_basic_auth.password }}@rpc.mev-relay-1.{{ network_subdomain }}"
  -t=1
  --blob-v1-percent=100
  --fulu-activation=1
  --max-pending=1000
  --blobfee=200
  --basefee=200
  --throughput-increment-interval=300


