# role: ethpandaops.general.ethereum_node
ethereum_node_el: reth
reth_rbuilder_enabled: true

# reth configuration
reth_datadir: /data/reth
reth_auth_jwt_path: /data/execution-auth.jwt

# role: ethpandaops.general.reth
reth_container_name: execution
reth_container_env:
  VIRTUAL_HOST: "{{ ethereum_node_rcp_hostname }}"
  VIRTUAL_PORT: "{{ ethereum_node_el_ports_http_rpc | string }}"
  LETSENCRYPT_HOST: "{{ ethereum_node_rcp_hostname }}"
  BUILDER_TX_SIGNING_KEY: "{{ secret_mev_signingkey }}"
  COINBASE_SECRET_KEY: "{{ secret_mev_signingkey }}"
  RELAY_SECRET_KEY: "{{ secret_mev_signingkey }}"
  OPTIMISTIC_RELAY_SECRET_KEY: "{{ secret_mev_signingkey }}"

reth_container_volumes:
  - "{{ reth_datadir }}:/data"
  - "{{ reth_auth_jwt_path }}:/execution-auth.jwt:ro"
  - "{{ eth_testnet_config_dir }}:/network-config:ro"


reth_container_ports_ipv4:
  - "127.0.0.1:{{ reth_ports_http_rpc }}:{{ reth_ports_http_rpc }}"
  - "127.0.0.1:{{ reth_ports_engine }}:{{ reth_ports_engine }}"
  - "127.0.0.1:{{ reth_ports_metrics }}:{{ reth_ports_metrics }}"
  - "127.0.0.1:{{ reth_ports_ws_rpc }}:{{ reth_ports_ws_rpc }}"
  - "0.0.0.0:{{ reth_ports_p2p }}:{{ reth_ports_p2p }}"
  - "0.0.0.0:{{ reth_ports_p2p }}:{{ reth_ports_p2p }}/udp"
  - "0.0.0.0:8645:8645"

reth_container_command_extra_args:
  - --chain=/network-config/genesis.json
  - --bootnodes={{ ethereum_el_bootnodes | join(',') }}
  #- --ethstats={{ inventory_hostname }}:{{ ethstats_secret }}@{{ ethstats_url }}
  - --http.api=trace,rpc,eth,net,debug,web3,admin,flashbots,txpool
  - --ws.api=trace,rpc,eth,net,debug,web3,admin,flashbots,txpool
  - --ws.origins=*
  - --builder.gaslimit=60000000
  - --engine.persistence-threshold=0
  - --engine.memory-block-buffer-target=0
  - --rpc.eth-proof-window=3
  - --txpool.no-local-transactions-propagation
  - --rpc-max-request-size=52428800
reth_container_pull: true

reth_container_image: "{{ default_tooling_images.mev_builder }}"
ethereum_node_json_rpc_snooper_engine_enabled: false

reth_rbuilder_config: |
  log_json = true
  log_level = "debug,rbuilder=debug"
  redacted_telemetry_server_port = 6061
  redacted_telemetry_server_ip = "0.0.0.0"
  full_telemetry_server_port = 6062
  full_telemetry_server_ip = "0.0.0.0"

  chain = "/network-config/genesis.json"
  reth_datadir = "/data/reth"

  coinbase_secret_key = "env:COINBASE_SECRET_KEY"
  relay_secret_key = "env:RELAY_SECRET_KEY"
  optimistic_relay_secret_key = "env:OPTIMISTIC_RELAY_SECRET_KEY"

  cl_node_url = ["http://beacon:5052"]
  jsonrpc_server_port = 8645
  jsonrpc_server_ip = "0.0.0.0"
  el_node_ipc_path = "/tmp/reth.ipc"
  extra_data = "🐼⚡🤖⚡☀️"

  ignore_cancellable_orders = true

  genesis_fork_version = "0x10{{ ethereum_genesis_fork_version_suffix }}"

  sbundle_mergeable_signers = []
  live_builders = ["mp-ordering"]

  enabled_relays = ["flashbots"]

  root_hash_use_sparse_trie=true
  root_hash_compare_sparse_trie=false

  subsidy = "1"
  #time_to_keep_mempool_txs_secs=100000
  simulation_threads=8

  [[relays]]
  name = "flashbots"
  url = "http://0xa55c1285d84ba83a5ad26420cd5ad3091e49c55a813eee651cd467db38a8c8e63192f47955e9376f6b42f6d190571cb5@mev-relay-api:9062"
  priority = 0
  use_ssz_for_submit = true
  use_gzip_for_submit = true

  [[builders]]
  name = "mp-ordering"
  algo = "ordering-builder"
  discard_txs = true
  sorting = "max-profit"
  failed_order_retries = 1
  drop_failed_orders = true
  build_duration_deadline_ms = 3000

ethereum_node_docker_watchtower_containers_list:
  - execution
  - beacon
  - validator
  - xatu-sentry
  - mev-relay-housekeeper
  - mev-relay-api
  - mev-relay-website

# Prometheus configuration for mev-relay
prometheus_remote_push_url: "{{ secret_prometheus_remote_write.endpoint }}"
prometheus_remote_write_username: "{{ secret_prometheus_remote_write.username }}"
prometheus_remote_write_password: "{{ secret_prometheus_remote_write.password }}"
prometheus_config: |
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
    scrape_timeout: 10s
    external_labels:
      instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
      ip_address: "{{ ansible_host }}"
      network: "{{ ethereum_network_name }}"
      testnet: "{{ ethereum_network_name }}"
      execution_client: "{{ ethereum_node_el }}"
      consensus_client: "{{ ethereum_node_cl }}"
      supernode: "{{ ethereum_node_cl_supernode_enabled | bool }}"
  remote_write:
    - queue_config:
        batch_send_deadline: 5s
        max_backoff: 500ms
        max_samples_per_send: 500
        min_backoff: 50ms
        max_shards: 100
      url: {{ prometheus_remote_push_url }}
      remote_timeout: 10s
      basic_auth:
        username: {{ prometheus_remote_write_username }}
        password: {{ prometheus_remote_write_password }}
  scrape_configs:
    - job_name: "prometheus"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["localhost:9090"]
          labels:
            instance: "{{ inventory_hostname }}"
    - job_name: "node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["172.17.0.1:9100"]
          labels:
            instance: "{{ inventory_hostname }}"
    - job_name: "exporter"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["ethereum-metrics-exporter:9090"]
          labels:
            instance: "{{ inventory_hostname }}"
    - job_name: "mev_relay_housekeeper"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["mev-relay-housekeeper:9090"]
          labels:
